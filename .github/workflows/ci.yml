name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  sqlite:
    name: tests and demo (SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest
      - name: Offline demo runs clean
        run: python demo/run_demo.py

  postgres:
    name: tests (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ops
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: ops_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ops -d ops_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://ops:ci-only-password@localhost:5432/ops_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt -r requirements-postgres.txt
      - run: python -m pytest
